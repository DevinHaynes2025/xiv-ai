stages:
  - validate

offline-brain-contracts:
  stage: validate
  image: node:22-bookworm-slim
  timeout: 5m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - cd services/ai
    - npm ci --no-audit --no-fund
  script:
    - npm run typecheck:12d-92
    - npm run test:12d-85
    - npm run test:12d-86
    - npm run test:12d-87
    - npm run test:12d-88
    - npm run test:12d-89
    - npm run test:12d-90
    - npm run test:12d-91
    - npm run test:12d-92
    - node node_modules/tsx/dist/cli.mjs --test runtime/offline-team/runtime-type-surface.test.ts
    - node node_modules/tsx/dist/cli.mjs runtime/offline-team/multi-agent-meeting-bus.test.ts
    - node node_modules/tsx/dist/cli.mjs runtime/offline-team/secure-device-pilot-local-learning.test.ts
    - node node_modules/tsx/dist/cli.mjs --test runtime/offline-team/bounded-background-shift.test.ts runtime/offline-team/agent-census.integration.test.ts runtime/offline-team/approved-master-plan-meeting.test.ts
    - node node_modules/tsx/dist/cli.mjs runtime/offline-team/background-shift.cli.ts --census

ai-service-typecheck:
  stage: validate
  image: node:22-bookworm-slim
  timeout: 5m
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - cd services/ai
    - npm ci --no-audit --no-fund
  script:
    - npm run typecheck
