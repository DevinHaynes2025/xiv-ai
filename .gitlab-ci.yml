stages:
  - validate

offline-brain-contracts:
  stage: validate
  image: node:22-bookworm-slim
  timeout: 5m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - cd services/ai
    - npm ci --no-audit --no-fund
  script:
    - npm run typecheck:12d-92
    - npm run test:12d-85
