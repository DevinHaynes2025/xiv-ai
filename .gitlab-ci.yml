stages:
  - validate

offline-brain-contracts:
  stage: validate
  image: node:22-bookworm-slim
  rules:
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - cd services/ai
    - npm ci --no-audit --no-fund
  script:
    - npm run typecheck
    - npm run test:12d-85
    - npm run test:12d-86
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key: "xiv-ai-${CI_COMMIT_REF_SLUG}"
    paths:
      - .npm/
