ai-service-typecheck:
  stage: validate
  image: node:22-bookworm-slim
  timeout: 5m
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - cd services/ai
    - npm ci --no-audit --no-fund
  script:
    - npm run typecheck
