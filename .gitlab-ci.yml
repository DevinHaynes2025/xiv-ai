stages:
  - validate

offline-brain-contracts:
  stage: validate
  image: node:22-bookworm-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - cd services/ai
    - npm ci --no-audit --no-fund
  script:
    - npm run test:12d-85
    - npm run test:12d-86
    - npm run test:12d-87
    - npm run test:12d-88
    - npm run test:12d-89
    - npm run test:12d-90
    - npm run test:12d-91

legacy-typecheck:
  stage: validate
  image: node:22-bookworm-slim
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - cd services/ai
    - npm ci --no-audit --no-fund
  script:
    - npm run typecheck
